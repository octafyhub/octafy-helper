name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Stage package for maintainer approval
        run: npm stage publish --access public
